version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: drf_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-drf_db}
      POSTGRES_USER: ${POSTGRES_USER:-drf_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-drf_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-drf_user} -d ${POSTGRES_DB:-drf_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: drf_web
    restart: always
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: